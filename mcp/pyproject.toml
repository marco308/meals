[project]
name = "meals-mcp"
version = "1.6.1"
description = "MCP server wrapping the Meals REST API with task-level tools for AI assistants"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "httpx2>=2.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meals_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
