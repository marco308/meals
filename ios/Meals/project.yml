name: Meals
options:
  bundleIdPrefix: com.marcuslab
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Meals:
    type: application
    platform: iOS
    sources:
      - Meals
    resources:
      - path: Meals/Resources
        excludes:
          - "**/.DS_Store"
    info:
      path: Meals/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "0.1"
        # App Store Connect is the source of truth for what has shipped —
        # uploads have come from outside this repo, so check the latest build
        # there and set this above it before `make ios-testflight`.
        CFBundleVersion: "15"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslab.meals
        PRODUCT_NAME: Meals
        CODE_SIGN_STYLE: Automatic
        # Your Apple Developer team. Simulator builds don't need it; archiving
        # for a device or TestFlight does. Set it in an untracked ios/.env
        # (see the ios-testflight comment in the Makefile) — xcodegen expands
        # the environment variable when it generates the project.
        DEVELOPMENT_TEAM: ${MEALS_DEVELOPMENT_TEAM}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize

  MealsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MealsTests
    dependencies:
      - target: Meals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslab.meals.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Meals:
    build:
      targets:
        Meals: all
        MealsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MealsTests
    profile:
      config: Release
    archive:
      config: Release
