name: Meals
options:
  bundleIdPrefix: com.marcuslab
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # NB: this is the *project* level and targets override it — xcodegen writes
    # "1,2" onto every iOS target by default. The one that counts is on the
    # Meals target below; see the comment there.
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Meals:
    type: application
    platform: iOS
    sources:
      - Meals
      - Shared
    dependencies:
      - target: MealsWidgets
    resources:
      - path: Meals/Resources
        excludes:
          - "**/.DS_Store"
    info:
      path: Meals/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        # The App Store version record is 1.0, and a build can only attach to a
        # version whose string it matches — builds 1–15 went up as 0.1 and are
        # therefore TestFlight-only forever.
        CFBundleShortVersionString: "1.2"
        # App Store Connect is the source of truth for what has shipped —
        # uploads have come from outside this repo, so check the latest build
        # there and set this above it before `make ios-testflight`. Then add a
        # row to ios/CHANGELOG.md and move current_ios_build in the backend.
        CFBundleVersion: "33"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Meal times on the Lock Screen (MealTimes.swift). The background
        # refresh takes a finished meal time down and schedules the next one.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.marcuslab.meals.mealtimes
        # Q25: read while the app is open, compared on the phone with the saved
        # stores, never sent. Saved stores come from place search, not from
        # this, which is why App Store privacy can keep Location "not collected".
        NSLocationWhenInUseUsageDescription: "To sort your shopping list by the aisles of the store you're in, and to find stores near you. Your location stays on your phone."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslab.meals
        PRODUCT_NAME: Meals
        # iPhone only, and it has to be said *here*: xcodegen defaults every
        # iOS target to "1,2", and a target setting beats the project one. The
        # project-level line above was silently doing nothing, so builds 1–16
        # all shipped claiming iPad support they were never designed or tested
        # for — which is what made App Store Connect demand 13" iPad
        # screenshots, and why validation used to insist on the ~ipad
        # orientation keys in the Info.plist above.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Your Apple Developer team. Simulator builds don't need it; archiving
        # for a device or TestFlight does. Set it in an untracked ios/.env
        # (see the ios-testflight comment in the Makefile) — xcodegen expands
        # the environment variable when it generates the project.
        DEVELOPMENT_TEAM: ${MEALS_DEVELOPMENT_TEAM}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize

  # Draws the meal-time Live Activities. It holds no API client and no data of
  # its own: everything it shows arrives in the activity from the app.
  # Its two version numbers must match the app's above, or the upload is refused.
  MealsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - MealsWidgets
      - Shared
    info:
      path: MealsWidgets/Info.plist
      properties:
        CFBundleDisplayName: Meals
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "33"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslab.meals.widgets
        PRODUCT_NAME: MealsWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${MEALS_DEVELOPMENT_TEAM}
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES

  MealsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MealsTests
    dependencies:
      - target: Meals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslab.meals.tests
        GENERATE_INFOPLIST_FILE: YES

  # Drives the app to capture the App Store screenshot set. Deliberately not in
  # the Meals scheme: it needs a seeded API running on the host, so it must not
  # be able to break `make ios-test`. Run it with `make ios-screenshots`.
  MealsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MealsUITests
    dependencies:
      - target: Meals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslab.meals.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Meals:
    build:
      targets:
        Meals: all
        MealsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MealsTests
    profile:
      config: Release
    archive:
      config: Release

  MealsScreenshots:
    build:
      targets:
        Meals: all
        MealsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MealsUITests
