[project]
name = "meals-backend"
version = "1.6.1"
description = "Meal options planner backend — recipes, meals, plans, aisle-sorted shopping list, AI-friendly API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.19.1",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "bcrypt>=4.1",
    "aiosmtplib>=3.0",
    "markdown-it-py>=3.0",
    "prometheus-client>=0.26.0",
    # The MCP server, mounted at /mcp so one container is the whole product
    # (app/mcp_mount.py). It stays a separate package with its own image and
    # its own tests: this is a path dependency, not a merge.
    "meals-mcp",
]

[tool.uv.sources]
meals-mcp = { path = "../mcp" }

[dependency-groups]
dev = [
    "httpx2>=2.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app"]
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # function-call-in-default-argument — false positive for FastAPI's Depends() and Query()
    "E712",  # true-false-comparison — SQLAlchemy filter expressions require `== True`
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
