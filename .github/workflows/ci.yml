name: CI

# What runs here is what `make lint` / `make test` run locally — the Makefile
# stays the single source of truth — plus the two things a laptop can't check
# cheaply: migrations against real Postgres, and the images actually booting.
#
# There is deliberately no iOS job: macOS runners are expensive and
# `make ios-build` / `make ios-test` stay local until the repo is open source.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A stale uv.lock fails the job instead of silently resolving around it.
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - run: make lint

  test:
    name: tests (backend + mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      # SQLite, no services, no network (respx stubs external HTTP) — same as local.
      - run: make test

  migrations:
    name: migrations on postgres
    runs-on: ubuntu-latest
    # The test suite builds its schema with `Base.metadata.create_all`, so a
    # migration that is missing, unrunnable, or SQLite-only is invisible to it.
    # The container runs `alembic upgrade head` on boot, so that class of bug
    # is a crashlooping API, not a test failure. Catch it here, on the engine
    # production actually uses.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meals
          POSTGRES_PASSWORD: meals
          POSTGRES_DB: meals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meals -d meals"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://meals:meals@localhost:5432/meals
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - run: uv sync
      - name: alembic upgrade head
        run: uv run alembic upgrade head
      - name: No drift between the models and the migrations
        # `alembic check` autogenerates against the migrated database and fails
        # if anything would be emitted — i.e. a model change shipped without
        # `make migration`.
        run: uv run alembic check

  stack:
    name: docker stack smoke
    runs-on: ubuntu-latest
    # Everything the deploy verifies (deploy/deploy.sh), run against the same
    # images before they reach the swarm: the API boots and migrates, the skill
    # actually shipped inside the image (the build context is the repo root for
    # exactly that reason), and the remote MCP answers an initialize handshake.
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            curl -fsS --max-time 5 http://localhost:8000/healthz && exit 0
            sleep 2
          done
          echo "::error::the API never answered /healthz — it failed to boot or migrate"
          exit 1

      - name: Verify the published endpoints
        # NB: keep every check a bare command. `curl … && echo` is exempt from
        # set -e (bash skips -e for all but the last command of a && list), and
        # that pattern let a failed check pass once already in deploy.sh.
        run: |
          curl -fsS --max-time 10 http://localhost:8000/client-config
          curl -fsS --max-time 10 -o /dev/null http://localhost:8000/skill
          curl -fsS --max-time 10 -o /dev/null http://localhost:8000/prompt-pack
          # The skill is served with {{API_URL}} substituted from the request's
          # host headers; an unsubstituted placeholder ships a broken manual.
          curl -fsS --max-time 10 http://localhost:8000/skill > skill.md
          grep -q 'http://localhost:8000' skill.md
          ! grep -q '{{API_URL}}' skill.md
          # The App Store's privacy and support URLs point at these, and they
          # render markdown that has to be COPYed into the image separately from
          # app/. A build that forgets them breaks a live store listing, which
          # is not something to discover from a rejection email.
          curl -fsS --max-time 10 http://localhost:8000/privacy > privacy.html
          grep -q '<h1' privacy.html
          curl -fsS --max-time 10 -o /dev/null http://localhost:8000/support
          # /terms and /credits ride the same rails and are COPYed the same
          # way, so they can be forgotten the same way.
          curl -fsS --max-time 10 http://localhost:8000/terms > terms.html
          grep -q '<h1' terms.html
          curl -fsS --max-time 10 http://localhost:8000/credits > credits.html
          grep -q '<table' credits.html
          # The web client is COPYed into the image separately from app/ too —
          # a build that forgets it serves a 404 where the big-screen UI was.
          curl -fsS --max-time 10 http://localhost:8000/app/ > app.html
          grep -qi 'yamp' app.html
          curl -fsS --max-time 10 -o /dev/null http://localhost:8000/app/js/main.js

      - name: Verify the remote MCP initialize handshake
        # Both places it is served: its own container (what the swarm routes
        # /mcp to) and the API container itself, which is what makes a
        # one-container host the whole product (app/mcp_mount.py). A handshake
        # only proves the transport; the tool call after the seed is what
        # exercises the mounted server's loopback call back into the API.
        run: |
          for url in http://localhost:8100/mcp http://localhost:8000/mcp; do
            curl -fsS --max-time 20 -X POST "$url" \
              -H 'content-type: application/json' \
              -H 'accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              | tee mcp.txt
            grep -q '"serverInfo"' mcp.txt
          done

      - name: Seed demo data through the public API
        # `app.seed` drives register → recipes → meals → plan → shopping list
        # over HTTP, so this is the end-to-end smoke test: run it inside the
        # container so the job needs no Python of its own. It prints a demo PAT
        # into the log — that is for a throwaway database deleted at teardown.
        run: docker compose exec -T api .venv/bin/python -m app.seed | tee seed.txt

      - name: Call a tool through the MCP server mounted in the API
        # The single-container claim in full: an MCP client talks to the API
        # container, the server mounted in that same process calls the API back
        # over loopback with the caller's own bearer token, and real seeded data
        # comes out. Stateless HTTP, so no session id to carry between calls.
        run: |
          PAT=$(grep 'demo API PAT:' seed.txt | awk '{print $NF}')
          [ -n "$PAT" ]
          curl -fsS --max-time 20 -X POST http://localhost:8000/mcp \
            -H "authorization: Bearer $PAT" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_shopping_list","arguments":{}}}' \
            > tool.txt
          cat tool.txt
          # A refused call comes back as tool content too (isError stays false,
          # the text explains how to authenticate), so check for something only
          # a real list prints: the provenance suffix on a line.
          grep -q '(for:' tool.txt

      - name: Back up the seeded database and restore it into a scratch one
        # An untested backup is a hypothesis (issue #9), so the reference stack
        # ships the sidecar and CI runs the whole loop against real data: dump
        # what the seed just created, read the dump back, restore it into a
        # database that did not exist a moment ago, and check the rows arrived.
        # This is also what keeps the restore script honest — it is the script
        # someone runs on a bad day, and it is the least-rehearsed code here.
        run: |
          docker compose exec -T backup backup.sh
          docker compose exec -T backup restore.sh --target meals_restore_check --drop latest
          docker compose exec -T backup psql --dbname meals_restore_check --tuples-only --no-align \
            -c "select count(*) from recipes" > recipes.txt
          # A restore that produces an empty database exits 0 just as happily.
          [ "$(cat recipes.txt)" -gt 0 ]

      - name: The API image alone is a working install
        # The compose stack overrides DATABASE_URL, so nothing above ever
        # exercises the shape a one-container host actually runs: this image,
        # no arguments, no database service, SQLite under /data, not root.
        # `.github/workflows/release.yml` checks the *published* image the same
        # way; this catches it a merge earlier.
        run: |
          docker run -d --name yamp-solo -p 8001:8000 -v yamp-solo-data:/data meals-api
          for _ in $(seq 1 60); do
            curl -fsS --max-time 5 http://localhost:8001/healthz && break
            sleep 2
          done
          curl -fsS --max-time 10 -o /dev/null http://localhost:8001/healthz
          curl -fsS --max-time 10 -o /dev/null http://localhost:8001/app/
          curl -fsS --max-time 20 -X POST http://localhost:8001/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            > solo-mcp.txt
          grep -q '"serverInfo"' solo-mcp.txt
          [ "$(docker exec yamp-solo id -u)" = "1000" ]
          docker exec yamp-solo test -s /data/meals.db

      - name: Solo container logs
        if: failure()
        run: docker logs yamp-solo || true

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: |
          docker rm -f yamp-solo || true
          docker volume rm -f yamp-solo-data || true
          docker compose down -v
