name: Pages

# Publishes docs/ (the YAMP marketing site) as it stands on main. It replaces
# GitHub's built-in "deploy from branch" workflow, which pins
# actions/upload-artifact@v4 on Node 20 and can't be edited. There is no build
# step: docs/ is hand-written and carries .nojekyll, so it ships verbatim.
#
# Needs Settings → Pages → Source set to "GitHub Actions" (build_type
# "workflow"); on "Deploy from a branch" the built-in workflow runs instead.

on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
