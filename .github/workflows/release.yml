name: Release

# Publishes the images a self-hoster (or a host like PikaPods) actually pulls,
# and the GitHub release that names them. CI proves the images boot on every
# push; this is the same build, tagged, multi-arch, and pushed to GHCR.
#
# To cut a release: `git tag v1.2.3 && git push origin v1.2.3`. Nothing else
# is manual. workflow_dispatch builds without pushing, for checking that a
# change to this file still produces working images.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The default for any job that doesn't say otherwise: a read-only token. The
# jobs that push images or cut the release declare their own wider grants.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # The tag is what people pull; the version in the code is what the running
  # API reports about itself, and the deploy checks the live one against the
  # release it deployed. v1.0.1 shipped reporting 1.0.0 because nothing made
  # those agree, so now nothing can be released until they do.
  version:
    name: the code says what the tag says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag, both packages and the API all say the same version
        # Not gated with `if:` — a skipped job skips everything that needs it,
        # which would make the workflow_dispatch dry run do nothing at all.
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "not a tag, nothing to check"
            exit 0
          fi
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import re, sys, pathlib
          want = sys.argv[1]
          found = {
              "backend/pyproject.toml": re.search(r'^version = "([^"]+)"', pathlib.Path("backend/pyproject.toml").read_text(), re.M),
              "mcp/pyproject.toml": re.search(r'^version = "([^"]+)"', pathlib.Path("mcp/pyproject.toml").read_text(), re.M),
              "backend/app/main.py": re.search(r'^    version="([^"]+)",', pathlib.Path("backend/app/main.py").read_text(), re.M),
          }
          bad = {f: (m.group(1) if m else None) for f, m in found.items() if not m or m.group(1) != want}
          for f, got in bad.items():
              print(f"::error file={f}::says {got}, tag says {want}")
          sys.exit(1 if bad else 0)
          PY

  images:
    needs: version
    name: build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # The API image is the product: it serves the API, the web client,
          # the skill, and the MCP endpoint. Build context is the repo root
          # because skill/, web/ and mcp/ all ship inside it.
          - name: api
            image: meals
            context: .
            dockerfile: backend/Dockerfile
          # Still published separately, for anyone who wants the remote MCP
          # server on its own host (what the swarm deployment runs).
          - name: mcp
            image: meals-mcp
            context: mcp
            dockerfile: mcp/Dockerfile
          # The nightly pg_dump sidecar. Published for the same reason as the
          # other two: a deployment that pulls its images by digest cannot have
          # one of them built by hand on the node.
          - name: backup
            image: meals-backup
            context: backup
            dockerfile: backup/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # arm64 matters here: a lot of self-hosting happens on a Pi or an ARM
      # VPS, and an amd64-only image is a bug report rather than a download.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # v1.2.3 publishes :1.2.3, :1.2 and :latest. No :1, because a major
          # version that moves under people is the tag nobody can pin against.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=YAMP ${{ matrix.name }}
            org.opencontainers.image.description=Yet Another Meal Planner — self-hosted meal planning with an AI-first API
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: the published image runs
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # The point of publishing is that someone pulls this and runs it with no
    # arguments. So pull the tag that was just pushed and do exactly that:
    # nothing but the image, no database service, no environment. If the
    # single-container story is broken, it breaks here rather than in an issue.
    steps:
      # These packages are public (inherited from the repo), so this login is
      # not strictly needed today. It stays because package visibility is a
      # setting with no API behind it, and a job that can only verify a public
      # image is a job that breaks the day somebody changes that setting.
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the image the way a one-container host would
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/meals:${GITHUB_REF_NAME#v}
          docker run -d --name yamp -p 8000:8000 -v yamp-data:/data "$IMAGE"
          for _ in $(seq 1 60); do
            curl -fsS --max-time 5 http://localhost:8000/healthz && break
            sleep 2
          done
          curl -fsS --max-time 10 -o /dev/null http://localhost:8000/healthz
          curl -fsS --max-time 10 -o /dev/null http://localhost:8000/app/
          curl -fsS --max-time 10 -o /dev/null http://localhost:8000/skill
          curl -fsS --max-time 20 -X POST http://localhost:8000/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            > mcp.txt
          grep -q '"serverInfo"' mcp.txt
          # It defaults to SQLite under /data, and it is not running as root.
          [ "$(docker exec yamp id -u)" = "1000" ]
          docker exec yamp test -s /data/meals.db

      - name: Container logs
        if: failure()
        run: docker logs yamp

  release:
    name: github release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Images, all linux/amd64 and linux/arm64: \`ghcr.io/${{ github.repository_owner }}/meals:${GITHUB_REF_NAME#v}\` (API, web client, skill and MCP in one container), \`…/meals-mcp:${GITHUB_REF_NAME#v}\` (the MCP server alone) and \`…/meals-backup:${GITHUB_REF_NAME#v}\` (the pg_dump sidecar)."
