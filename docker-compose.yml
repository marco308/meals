name: meals

# The database password is POSTGRES_PASSWORD, from the environment or from a
# .env beside this file. The default of `meals` is for a laptop and nothing
# else: on any other machine, set your own before the first `make up`, because
# Postgres reads it only when it creates the pgdata volume (after that, change
# it with ALTER ROLE, or start over with `make nuke`). It is spliced into
# DATABASE_URL below, so pick one that needs no URL-escaping, such as
# `openssl rand -hex 32`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meals
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meals}
      POSTGRES_DB: meals
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only. It is here for `make db` (an API on the host talking to
    # this Postgres, see .env.example), and nothing off the machine needs it.
    # Docker writes its own firewall rules for a published port, so ufw never
    # sees them: the old "5433:5432" put this superuser on every interface of
    # any host that ran `make up`.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meals -d meals"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    # Repo-root context so skill/, web/ and mcp/ ship in the image: the last of
    # those because the API serves the MCP endpoint at /mcp itself
    # (app/mcp_mount.py), which is what makes one container the whole product.
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://meals:${POSTGRES_PASSWORD:-meals}@db:5432/meals
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Nightly pg_dump, verified and rotated (issue #9). Local-only as shipped —
  # set RCLONE_REMOTE and BACKUP_PASSPHRASE_FILE to also send an encrypted copy
  # off the node, which is the half that survives losing the machine. See
  # backup/README.md, and `docker compose exec backup restore.sh latest` for
  # the way back.
  backup:
    build: ./backup
    environment:
      PGHOST: db
      PGUSER: meals
      PGPASSWORD: ${POSTGRES_PASSWORD:-meals}
      PGDATABASE: meals
      LOG_FORMAT: text
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

  # Remote MCP (streamable HTTP) as its own service: connect an MCP client to
  # http://localhost:8100/mcp with an Authorization: Bearer <token> header.
  # Optional since the API serves the same endpoint at http://localhost:8000/mcp
  # (MCP_ENABLED=false turns that off). It is kept here because the reference
  # deployment is the swarm one, which routes /mcp to this container, and
  # because a separate service is what you want when the two scale apart.
  mcp:
    build: ./mcp
    environment:
      MEALS_API_URL: http://api:8000
    ports:
      - "8100:8000"
    depends_on:
      - api

volumes:
  pgdata:
  backups:
