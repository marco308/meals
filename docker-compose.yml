name: meals

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meals
      POSTGRES_PASSWORD: meals
      POSTGRES_DB: meals
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meals -d meals"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    # Repo-root context so skill/ ships in the image (served at /skill, /prompt-pack)
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://meals:meals@db:5432/meals
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Remote MCP (streamable HTTP): connect an MCP client to
  # http://localhost:8100/mcp with an Authorization: Bearer <token> header.
  mcp:
    build: ./mcp
    environment:
      MEALS_API_URL: http://api:8000
    ports:
      - "8100:8000"
    depends_on:
      - api

volumes:
  pgdata:
